<div class="container py-5" style="max-width: 550px;">
  <div class="card shadow-sm border rounded-3">
    <div class="card-header bg-primary text-white text-center py-3 border-bottom rounded-top-3">
      <h4 class="fw-bold mb-1"><i class="fa-solid fa-user-plus me-2"></i>Register as Employee</h4>
      <p class="small text-white-50 mb-0">Create your Internal Job Posting employee account</p>
    </div>

    <div class="card-body p-4">

      <!-- Success Alert -->
      <div *ngIf="successMessage" class="alert alert-success shadow-sm mb-4 py-2 small" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>{{ successMessage }}
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger shadow-sm mb-4 py-2 small" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>{{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" #regForm="ngForm" autocomplete="off">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="regFirstName" class="form-label fw-semibold small">First Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="regFirstName" name="firstName" [(ngModel)]="candidate.firstName" required placeholder="First Name" autocomplete="off" />
          </div>
          <div class="col-md-6 mb-3">
            <label for="regLastName" class="form-label fw-semibold small">Last Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="regLastName" name="lastName" [(ngModel)]="candidate.lastName" required placeholder="Last Name" autocomplete="off" />
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="regEmployeeId" class="form-label fw-semibold small">Employee ID <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="regEmployeeId" name="employeeId" [(ngModel)]="candidate.employeeId" required placeholder="e.g. EMP101" autocomplete="off" />
          </div>
          <div class="col-md-6 mb-3">
            <label for="regDob" class="form-label fw-semibold small">Date of Birth <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="regDob" name="dob" [(ngModel)]="candidate.dob" required />
          </div>
        </div>

        <div class="mb-3">
          <label for="regEmail" class="form-label fw-semibold small">Company Email <span class="text-danger">*</span></label>
          <input type="email" class="form-control" id="regEmail" name="email" [(ngModel)]="candidate.email" #regEmailModel="ngModel" pattern="^[^@\s]+@company\.com$" required placeholder="username@company.com" autocomplete="off" />
          <div class="form-text extra-small text-muted">Must be a valid company email ending with &#64;company.com.</div>
          <div *ngIf="regEmailModel.invalid && (regEmailModel.dirty || regEmailModel.touched)" class="text-danger extra-small mt-1">
            Please enter a valid company email address ending with &#64;company.com.
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="regPassword" class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="regPassword" name="password" [(ngModel)]="candidate.password" required placeholder="Enter password" autocomplete="new-password" />
          </div>
          <div class="col-md-6 mb-3">
            <label for="regConfirmPassword" class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="regConfirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="Re-enter password" autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" [disabled]="!regForm.form.valid || isSubmitting" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status"></span>
          Register Account
        </button>

        <div class="mt-3 text-center">
          <span class="small text-muted">Already have an account? </span>
          <a routerLink="/login" class="small fw-semibold text-primary text-decoration-none">Back to Login</a>
        </div>
      </form>

    </div>
  </div>
</div>
