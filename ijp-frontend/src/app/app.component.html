<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/">
      <i class="fa-solid fa-briefcase me-2"></i>IJP Portal
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Common Home -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>

        <!-- Unauthenticated Guest Links -->
        <ng-container *ngIf="!authService.isLoggedIn()">
          <li class="nav-item">
            <a class="nav-link cursor-pointer" (click)="scrollToSection('open-positions')">Open Positions</a>
          </li>
          <li class="nav-item">
            <a class="nav-link cursor-pointer" (click)="scrollToSection('about-company')">About</a>
          </li>
        </ng-container>

        <!-- Employee Links -->
        <ng-container *ngIf="authService.isEmployee()">
          <li class="nav-item">
            <a class="nav-link cursor-pointer" (click)="scrollToSection('open-positions')">Apply for Job / Open Positions</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/notifications" routerLinkActive="active">Notifications</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/employee-dashboard" routerLinkActive="active">Employee Dashboard</a>
          </li>
        </ng-container>

        <!-- Admin Links -->
        <ng-container *ngIf="authService.isAdmin()">
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin-dashboard" routerLinkActive="active">Admin Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link cursor-pointer" (click)="scrollToSection('open-positions')">Job Postings</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin-dashboard" routerLinkActive="active">Candidates</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin-dashboard" routerLinkActive="active">Designation Master</a>
          </li>
        </ng-container>
      </ul>

      <!-- Right Action Area -->
      <div class="d-flex align-items-center gap-2">
        <a *ngIf="!authService.isLoggedIn()" routerLink="/login" class="btn btn-light text-primary fw-semibold btn-sm px-3">
          Login
        </a>

        <ng-container *ngIf="authService.isLoggedIn()">
          <span class="text-white small me-2">
            <i class="fa-solid fa-user-circle me-1"></i>{{ authService.currentUserValue?.name }} ({{ authService.currentUserValue?.role }})
          </span>
          <button (click)="onLogout()" class="btn btn-outline-light btn-sm px-3">
            Logout
          </button>
        </ng-container>
      </div>

    </div>
  </div>
</nav>

<!-- Main Outlet -->
<main class="main-container">
  <router-outlet></router-outlet>
</main>
